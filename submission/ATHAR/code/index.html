<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثر · مركز قيادة أثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:ital,wght@1,800&display=swap">
<style>
:root{--blue:#1855A4;--teal:#5BC4CE;--navy:#050E1F;--ink:#F2F7FC;--muted:#A9BFD6;--faint:#7F94AE;--line:rgba(91,196,206,.16);--card:rgba(16,32,60,.78);--card2:rgba(22,42,76,.85);
--red:#FF5D5D;--red-s:rgba(228,87,61,.18);--orange:#F2A93B;--orange-s:rgba(242,169,59,.16);--green:#4CC38A;--green-s:rgba(76,195,138,.16);--slate:#8FA9C8;--slate-s:rgba(143,169,200,.16);
--font:'IBM Plex Sans Arabic','Sakkal Majalla',Tahoma,sans-serif}
:root[data-theme="light"]{--navy:#F3F7FB;--ink:#12243D;--muted:#5B6F8A;--faint:#8A9BB2;--line:#E2EAF3;--card:#fff;--card2:#F6F9FC;--slate:#5F7896}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.55;
 background:radial-gradient(900px 500px at 80% -10%,rgba(91,196,206,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(24,85,164,.35),transparent 60%),linear-gradient(160deg,#050E1F 0%,#0A1A36 55%,#071429 100%);background-attachment:fixed}
:root[data-theme="light"] body{background:#F3F7FB}
html[lang="en"] body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#fff}
select option{color:#12243D}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#050E1F,#0B1B36 70%,#0A1830);border-inline-end:1px solid rgba(91,196,206,.14);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;color:#F2F7FC}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;direction:rtl}
.logo .ar{font-size:38px;font-weight:700;line-height:1}
.logo .vl{width:4px;height:36px;border-radius:4px;background:linear-gradient(180deg,var(--blue),var(--teal));box-shadow:0 0 12px rgba(91,196,206,.6)}
.logo .en{font-family:Montserrat,sans-serif;font-style:italic;font-weight:800;font-size:24px;color:var(--teal);letter-spacing:.02em}
.tagline{text-align:center;font-size:11.5px;color:#A9BFD6;margin:6px 0 22px;font-family:Montserrat,sans-serif;font-style:normal;letter-spacing:.02em}
nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:transparent;color:#C9D8E8;font-weight:600;text-align:start}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(91,196,206,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,196,206,.3)}
nav svg{width:20px;height:20px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:#7F94AE;text-align:center;line-height:1.6}
main{padding:20px 26px 110px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search{flex:1;max-width:520px;position:relative}
.search input{padding-inline-start:38px;border-radius:12px;background:var(--card)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue);font-weight:700;font-size:13px;color:#fff}
.who b{display:block;font-size:14px}.who span{font-size:12px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px}
.demo-note{display:flex;align-items:center;gap:10px;background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.35);color:#FFD89A;border-radius:12px;padding:8px 14px;font-size:13px;margin-bottom:14px}
:root[data-theme="light"] .demo-note{color:#8F5300}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 12px 30px rgba(0,0,0,.25);backdrop-filter:blur(10px)}
:root[data-theme="light"] .card{box-shadow:0 6px 18px rgba(18,36,61,.06)}
h1{font-size:26px;font-weight:700}h2{font-size:18px;font-weight:700}h3{font-size:15.5px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:12.5px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 26px;margin-bottom:16px;background:linear-gradient(120deg,rgba(11,42,85,.92),rgba(24,85,164,.85) 60%,rgba(31,111,176,.8));border:1px solid rgba(91,196,206,.25);color:#fff}
.hero::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:var(--teal);filter:blur(80px);opacity:.35;inset-inline-end:-120px;top:-200px}
.hero p{color:#CFE1EF;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .v{font-size:30px;font-weight:700;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.chip.on{background:linear-gradient(90deg,var(--blue),var(--teal));color:#fff;border-color:transparent}
.grid-cases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ccard{cursor:pointer;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:10px}
.ccard:hover{transform:translateY(-3px);border-color:rgba(91,196,206,.45)}
.ccard.instant{box-shadow:0 0 0 1px rgba(255,93,93,.55),0 0 26px rgba(228,87,61,.25)}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.b-inst{background:var(--red-s);color:#FFB3A6;border:1px solid rgba(255,93,93,.5)}
.b-cum{background:var(--orange-s);color:#FFD89A;border:1px solid rgba(242,169,59,.45)}
:root[data-theme="light"] .b-inst{color:#B0331F}:root[data-theme="light"] .b-cum{color:#8F5300}
.st{border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--slate-s);color:var(--slate)}
.st.done{background:var(--green-s);color:var(--green)}.st.esc{background:var(--red-s);color:var(--red)}.st.work{background:rgba(91,196,206,.15);color:var(--teal)}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:28px;line-height:1}
.lvl{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.lv-low{background:var(--slate-s);color:var(--slate)}.lv-med{background:var(--orange-s);color:var(--orange)}.lv-high{background:var(--red-s);color:var(--red)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:rgba(91,196,206,.5)}
.btn.p{background:linear-gradient(90deg,var(--blue),var(--teal));border:0;color:#fff;box-shadow:0 8px 20px rgba(91,196,206,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px}
.case-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px}
.alertbox{border-radius:14px;padding:12px 16px;background:var(--red-s);border:1px solid rgba(255,93,93,.55);display:flex;gap:12px;align-items:flex-start}
.alertbox.ended{background:rgba(242,169,59,.10);border-color:rgba(242,169,59,.45)}
.alertbox svg{width:22px;height:22px;flex:none;color:var(--red);margin-top:2px}
.sim{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-family:Montserrat,sans-serif;font-style:normal;font-weight:800;font-size:20px;color:var(--teal);direction:ltr}
.tl{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
:root[data-theme="light"] .ev{background:#F8FBFE}
.ev .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.ev .meta i{font-style:normal;color:var(--faint)}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid var(--line)}
.tag.sys{color:#9EC9FF;border-color:rgba(111,167,255,.4)}.tag.loc{color:var(--teal);border-color:rgba(91,196,206,.5)}
.es{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.es.on{background:rgba(91,196,206,.15);color:var(--teal)}.es.off{background:var(--slate-s);color:var(--slate)}.es.chk{background:var(--orange-s);color:var(--orange)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--teal);padding-inline-start:10px;margin-top:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.form legend{padding:0 6px;font-weight:700;font-size:13px;color:var(--teal)}
.form label{display:block;font-size:12.5px;color:var(--muted);margin:6px 0 4px}
.err{color:var(--red);font-size:13px;margin-top:8px;font-weight:600}
.ok{color:var(--green);font-size:13px;margin-top:8px;font-weight:600}
.log{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.log div{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.log time{font-family:Montserrat,sans-serif;font-style:normal;font-weight:800;color:var(--teal);direction:ltr;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:12px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.bar b{text-align:end}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-bg{position:fixed;inset:0;background:rgba(3,10,25,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.path svg{width:100%;height:auto;display:block}
.tour{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;background:rgba(5,14,31,.94);border:1px solid rgba(91,196,206,.35);border-radius:999px;padding:8px 10px;box-shadow:0 14px 40px rgba(0,0,0,.5);color:#fff}
.tour .dots{display:flex;gap:5px}.tour .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}.tour .dots i.on{background:var(--teal)}
.tour span{font-size:13px;white-space:nowrap}
.hl{outline:2px solid var(--teal);outline-offset:4px;border-radius:16px;transition:outline-color .3s}
.empty{padding:20px;text-align:center;color:var(--muted)}
.why td b{font-family:Montserrat,sans-serif;font-style:normal}
@media(max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.kpis,.grid-cases{grid-template-columns:1fr 1fr}.case-grid,.an-grid,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><span class="ar">أثر</span><span class="vl"></span><span class="en">ATHAR</span></div>
    <div class="tagline">Silent Experience Intelligence Engine</div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <div class="top">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search"></div>
      <button class="tbtn" id="langBtn"></button>
      <div class="who"><div class="av" id="av"></div><div><b id="whoName"></b><span id="whoRole"></span></div></div>
    </div>
    <div class="demo-note" id="demoNote"></div>
    <div id="view"></div>
  </main>
</div>
<div class="tour" id="tour"></div>
<div class="modal-bg" id="mbg"><div class="card modal" id="modal"></div></div>

}

function logCard(c){
 return `<div class="card" id="tour-6"><div class="sec-h"><h2>${t('log_t')}</h2><span class="small muted">${t('log_sub')}</span></div>
 <div class="log">${c.log.slice().reverse().map(l=>`<div><time>${l.at}</time><span>${t(l.k)}${L(l.v)}</span></div>`).join('')}</div>
 <div class="card" style="margin-top:12px;background:var(--card2)"><h3>${t('learn_t')}</h3><p class="small muted" style="margin-top:4px">${t('learn_b')}</p></div></div>`;
}
function vCase(){
 const c=byId(route.id);if(!c)return go('home');
 return `<div class="hero" id="tour-2"><div class="crow"><div><button class="btn sm" data-go="${route.from||'home'}" style="margin-bottom:8px">← ${t('back')}</button><h1>${L(c.name)}</h1><p>${t('age')} ${c.age} · ${t('dept')}: ${L(DEPTS[c.dept])}</p></div><div style="text-align:end">${badgesOf(c)}<div style="margin-top:8px"><span class="st ${stCls(c.status)}" style="background:rgba(255,255,255,.12);color:#fff">${t('st_'+c.status)}</span></div></div></div></div>
 <div class="case-grid"><div class="col">${instBox(c)}${simBox(c)}${timeline(c)}${locCard(c)}</div>
 <div class="col">${scoreCard(c)}${askCard(c)}${formCard(c)}${logCard(c)}</div></div>`;

function bars(rows){const m=Math.max(1,...rows.map(r=>r[1]));return `<div class="bars">${rows.map(([l,v])=>`<div class="bar"><span>${l}</span><div class="tr"><div class="fl" style="width:${v/m*100}%"></div></div><b>${v}</b></div>`).join('')}</div>`}
const toMin=s=>{if(!s||!s.includes(':'))return null;const [h,m]=s.split(':').map(Number);return h*60+m};
function vAnalytics(){
 const ty={inst:0,cum:0,both:0,none:0};cases.forEach(c=>{const a=hasInst(c),b=hasCum(c);ty[a&&b?'both':a?'inst':b?'cum':'none']++});
 const stc={};cases.forEach(c=>stc[c.status]=(stc[c.status]||0)+1);
 const ttc=cases.map(c=>{const a=c.log.find(l=>l.k==='lg_alert'||l.k==='lg_signal'&&l.at!=='—');const ct=c.log.find(l=>l.k==='lg_contact');const d=a&&ct?toMin(ct.at)-toMin(a.at):null;return [L(c.name),d]}).filter(r=>r[1]!=null&&r[1]>=0);
 const need=cases.filter(c=>c.form.verify==='need').length, unr=cases.filter(c=>c.form.contact==='noans').length;
 const sp={};cases.forEach(c=>c.events.forEach(e=>{if(e.place&&c.signals.length)sp[e.place]=(sp[e.place]||0)+1}));
 const groups={};cases.forEach(c=>{const top=scoreRows(c).filter(r=>r.counted).sort((a,b)=>b.s.w-a.s.w)[0]||scoreRows(c)[0];if(!top)return;const k=top.s.key;groups[k]=groups[k]||{n:0,acts:new Set(),outs:new Set()};groups[k].n++;groups[k].acts.add(c.form.adesc||t('none_rec'));groups[k].outs.add(closed(c)?(c.form.rdesc||t('st_'+c.status)):t('not_doc'))});
 const sat=[91,92,91.6,92.8,93.1,92.6,93.4,93.9,93.2,93.8,94.3,94];
 const W=600,H=160,mn=90,mx=96;const ps=sat.map((v,i)=>[20+i*(W-40)/11,H-20-(v-mn)/(mx-mn)*(H-40)]);
 return `<div class="hero"><h1>${t('an_t')}</h1><p>${t('an_d')}</p></div>
 <div class="an-grid">
  <div class="card"><h3 style="margin-bottom:10px">${t('an_type')}</h3>${bars([[t('ty_inst'),ty.inst],[t('ty_cum'),ty.cum],[t('ty_both'),ty.both],[t('ty_none'),ty.none]])}</div>
  <div class="card"><h3 style="margin-bottom:10px">${t('an_status')}</h3>${bars(Object.keys(stc).map(k=>[t('st_'+k),stc[k]]))}</div>
  <div class="card"><h3 style="margin-bottom:10px">${t('an_ttc')}</h3>${ttc.length?bars(ttc):`<p class="small muted">${t('no_contact')}</p>`}</div>
  <div class="card"><h3 style="margin-bottom:10px">${t('an_sp')}</h3>${bars(Object.entries(sp).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>[L(P[k]),v]))}</div>
  <div class="card"><h3>${t('an_need')}</h3><div style="font-size:40px;font-weight:700;color:var(--teal)">${need}</div></div>
  <div class="card"><h3>${t('an_unr')}</h3><div style="font-size:40px;font-weight:700;color:var(--orange)">${unr}</div></div>
  <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:10px">${t('an_tbl')}</h3><table><thead><tr><th>${t('t_type')}</th><th>${t('t_act')}</th><th>${t('t_n')}</th><th>${t('t_out')}</th></tr></thead><tbody>
   ${Object.entries(groups).map(([k,g])=>`<tr><td>${L(SIG[k].n)}</td><td>${[...g.acts].join('؛ ')}</td><td>${g.n}</td><td>${[...g.outs].join('؛ ')}</td></tr>`).join('')}</tbody></table>
   <p class="note">${t('an_d')}</p></div>
  <div class="card" style="grid-column:1/-1"><h3>${t('an_sat')}</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px"><polyline points="${ps.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#5BC4CE" stroke-width="3"/>${ps.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#5BC4CE"/>`).join('')}<text x="${ps[11][0]}" y="${ps[11][1]-10}" fill="#CFE1EF" font-size="13" text-anchor="middle">94%</text></svg><p class="small muted">${t('an_sat_n')} ${t('illus')}.</p></div>
 </div>`;
}

/* ================= tour ================= */
const TOUR=[{v:'home',el:'tour-1'},{v:'case',id:'A-03',el:'tour-2a'},{v:'case',id:'A-03',el:'tour-3a'},{v:'case',id:'A-03',el:'tour-4'},{v:'case',id:'A-03',el:'tour-5'},{v:'case',id:'A-03',el:'tour-6'}];
function renderTour(){
 const el=document.getElementById('tour');
 el.innerHTML=`<button class="btn sm" data-tour="-1" ${tourStep===0?'disabled':''}>${lang==='ar'?'→':'←'} ${t('prev')}</button><div class="dots">${TOUR.map((_,i)=>`<i class="${i===tourStep?'on':''}"></i>`).join('')}</div><span>${t('step')} ${tourStep+1}/6 · ${t('tour')[tourStep]}</span><button class="btn p sm" data-tour="1" ${tourStep===5?'disabled':''}>${t('next')} ${lang==='ar'?'←':'→'}</button>`;
}
function applyTour(){
 const s=TOUR[tourStep];route={v:s.v,id:s.id||null,from:'home'};msg=null;render();
 const target=document.getElementById(s.el);document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
 if(target){target.classList.add('hl');target.scrollIntoView({behavior:'smooth',block:'center'})}
}

/* ================= render ================= */
function render(){
 renderChrome();
 const v=document.getElementById('view');
 v.innerHTML=route.v==='home'?vHome():route.v==='cases'?vCases():route.v==='case'?vCase():route.v==='analytics'?vAnalytics():vSettings();
 renderTour();
}

/* ================= scenario actions ================= */
function addLog(c,k,v){c.log.push({at:c.clock||(c.log.length?c.log[c.log.length-1].at:'—'),k,v})}
function advance(c){
 if(c.step===0){c.step=1;c.clock='09:12';
  c.events.push(evn({id:'e-reg',what:{ar:'التسجيل',en:'Registration'},start:'09:12',upd:'09:12',place:'reg',src:{ar:'نظام معلومات المستشفى',en:'HIS'}}));
  c.events.push(evn({id:'e-wait',what:{ar:'بدء انتظار العيادة',en:'Clinic waiting started'},start:'09:12',upd:'09:12',place:'cw',src:{ar:'نظام الطوابير',en:'Queue system'},status:'on'}));
  ping(c,['ent','reg','cw']);
 }else if(c.step===1){c.step=2;c.clock='09:43';
  const w=c.events.find(e=>e.id==='e-wait');w.what={ar:'انتظار العيادة: 31 دقيقة (1 دقيقة فوق الحد التوضيحي 30 د)',en:'Clinic waiting: 31 min (1 min over the 30-min illustrative limit)'};w.upd='09:43';
  c.inst={state:'open',at:'09:43',reason:{ar:'انتظار 31 دقيقة — تجاوز الحد التوضيحي (30 د)',en:'31 min wait — exceeded illustrative limit (30 min)'}};
  c.signals.push(sig('wait',{ev:'ev-wait'}));
  addLog(c,'lg_alert',{ar:'تجاوز حد انتظار الخدمة (انتظار 31 د)',en:'service waiting limit exceeded (31 min)'});
  addLog(c,'lg_signal',{ar:'انتظار يتجاوز الحد (12 نقطة) — المجموع التراكمي الحالي 20 نقطة',en:'waiting above limit (12 pts) — current cumulative total 20 pts'});
  if(c.status==='review')c.status='review';
 }else if(c.step===2){c.step=3;c.clock='10:02';
  const w=c.events.find(e=>e.id==='e-wait');w.what={ar:'انتهى الانتظار بعد 50 دقيقة (20 دقيقة فوق الحد التوضيحي)',en:'Waiting ended after 50 min (20 min over the illustrative limit)'};w.upd='10:02';w.status='off';
  c.events.push(evn({id:'e-clinic',what:{ar:'بدء خدمة العيادة',en:'Clinic service started'},start:'10:02',upd:'10:02',place:'cl',src:{ar:'نظام معلومات المستشفى',en:'HIS'},status:'on'}));
  const s=c.signals.find(x=>x.key==='wait');s.state='hist';
  if(c.inst&&c.inst.state==='open')c.inst.state='ended';
  addLog(c,'lg_cond_end',{ar:'',en:''});
  ping(c,['cl']);
 }
}
function ping(c,zones){if(c.consent.s==='granted'){zones.forEach(z=>c.loc.push(z));c.consent.last=c.clock}}
function addEvent(c,k){
 const g=c.consent.s==='granted';
 const tick={move:'10:41',ret:'10:55',appr:'11:02'}[k];c.clock=tick;c.added[k]=1;
 if(k==='appr'){
  c.events.push(evn({what:{ar:'موافقة تأمين معلقة تعيق استكمال الخدمة',en:'Insurance approval pending, blocking service completion'},start:tick,upd:tick,place:'ins',src:{ar:'نظام التأمين والموافقات',en:'Insurance & approvals'},status:'on'}));
  c.signals.push(sig('appr',{ev:'ev-appr'}));addLog(c,'lg_signal',{ar:'موافقة معلقة تعيق الخدمة (10 نقاط)',en:'pending approval blocking service (10 pts)'});ping(c,['ins']);return;
 }
 if(g){
  if(k==='move'){c.events.push(evn({what:{ar:'توجه إلى منطقة الأشعة دون طلب أشعة في هذه الزيارة',en:'Went to the radiology zone with no imaging order in this visit'},start:tick,upd:tick,place:'rad',psrc:'loc',src:{ar:'تحديد الموقع الداخلي (محاكاة)',en:'Indoor positioning (simulated)'},note:{ar:'مؤهلة: تمت مقارنتها بالخدمات المطلوبة والمسار المتوقع',en:'Qualifies: compared with requested services and expected path'}}));
   c.signals.push(sig('move',{ev:'ev-move-rad'}));ping(c,['rad']);addLog(c,'lg_signal',{ar:'تنقل غير متوقع إلى منطقة الأشعة (10 نقاط)',en:'unexpected movement to radiology (10 pts)'});}
  else{c.events.push(evn({what:{ar:'عودة إلى منطقة التسجيل بعد بدء خدمة العيادة',en:'Returned to registration after clinic service started'},start:tick,upd:tick,place:'reg',psrc:'loc',src:{ar:'تحديد الموقع الداخلي (محاكاة)',en:'Indoor positioning (simulated)'},note:{ar:'واقعة مستقلة عن التنقل إلى الأشعة؛ لا يُحتسب الدليل نفسه مرتين',en:'Separate from the radiology movement; the same evidence is not counted twice'}}));
   c.signals.push(sig('ret',{ev:'ev-return-reg'}));ping(c,['reg']);addLog(c,'lg_signal',{ar:'عودة غير متوقعة إلى محطة سابقة (10 نقاط)',en:'unexpected return to an earlier station (10 pts)'});}
 }else{
  const ev=k==='move'?{what:{ar:'تسجيل حضور في نقطة خدمة الأشعة',en:'Check-in at radiology service point'},place:'rad'}:{what:{ar:'تذكرة جديدة في نافذة التسجيل',en:'New ticket at registration desk'},place:'reg'};
  c.events.push(evn(Object.assign(ev,{start:tick,upd:tick,psrc:'sys',src:{ar:'نظام الطوابير',en:'Queue system'},status:'chk',note:{ar:'حدث نقطة خدمة من الأنظمة؛ لا يُحتسب كتنقل أو عودة دون موافقة التتبّع وبيانات المسار',en:'Service-point event from systems; not counted as movement/return without tracking consent and path data'}})));
 }
}
function saveForm(c){
 const fd=new FormData(document.getElementById('uform'));const f={};fd.forEach((v,k)=>f[k]=String(v).trim());
 const st=f.status;
 if(st==='resolved'&&f.contact==='noans')return msg={ok:false,text:t('e_noans')};
 if(st==='resolved'&&(!f.rdesc||!f.rhow))return msg={ok:false,text:t('e_res')};
 if(st==='resolved'&&f.contact!=='ok'&&!f.rdesc)return msg={ok:false,text:t('e_res_ct')};
 if(st==='closed_no_action'&&f.verify!=='noneed')return msg={ok:false,text:t('e_noaction')};
 if((st==='processing'||st==='escalated')&&(!f.adesc||!f.assignee))return msg={ok:false,text:t('e_act')};
 const o=c.form;let ch=0;const nowAt=c.clock||'—';
 const lg=(k,v)=>{c.log.push({at:nowAt,k,v});ch++};
 const txt=s=>({ar:s,en:s});
 if(f.assignee!==(o.assignee||''))lg('lg_assign',txt(f.assignee||t('dash')));
 if(f.contact!==o.contact)lg('lg_contact',{ar:D.ar['ct_'+f.contact],en:D.en['ct_'+f.contact]});
 if(f.verify!==o.verify)lg('lg_verify',{ar:D.ar['vf_'+f.verify],en:D.en['vf_'+f.verify]});
 if(f.adesc!==(o.adesc||''))lg('lg_action',txt(f.adesc+(f.owner?' · '+f.owner:'')));
 if(st!==c.status)lg('lg_status',{ar:D.ar['st_'+st],en:D.en['st_'+st]});
 if(f.rdesc!==(o.rdesc||'')&&f.rdesc)lg('lg_result',txt(f.rdesc+(f.rhow?' — '+f.rhow:'')));
 if(!ch&&f.owner===(o.owner||'')&&f.fu===(o.fu||'')&&f.rhow===(o.rhow||''))return msg={ok:false,text:t('nochange')};
 c.form=Object.assign(c.form,{contact:f.contact,verify:f.verify,adesc:f.adesc,owner:f.owner,assignee:f.assignee,fu:f.fu,rdesc:f.rdesc,rhow:f.rhow});
 c.status=st;if(closed(c)&&c.inst&&c.inst.state!=='closed')c.inst.state='closed';
 msg={ok:true,text:t('saved')};
}
function whyModal(c){
 const rows=scoreRows(c);const total=score(c);const lab={active:'ws_active',hist:'ws_hist',unq:'ws_unq',dup:'ws_dup'};
 openModal(`<h2>${t('why_t')} — ${L(c.name)}</h2><table class="why" style="margin-top:12px"><thead><tr><th>${t('w_sig')}</th><th>${t('w_w')}</th><th>${t('w_src')}</th><th>${t('w_state')}</th><th>${t('w_count')}</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td>${L(SIG[r.s.key].n)}</td><td><b>${r.s.w}</b></td><td>${L(SIG[r.s.key].src)}</td><td>${t(lab[r.st])}</td><td>${r.counted?t('yes'):t('no')}</td></tr>`).join('')}
 <tr><td><b>${t('w_total')}</b></td><td colspan="4"><b>${rows.filter(r=>r.counted).map(r=>r.s.w).join(' + ')||'0'} = ${total} ${t('pts')}</b> · <span class="lvl lv-${level(total)}">${t('lv_'+level(total))}</span></td></tr></tbody></table>
 <p class="note">${t('why_note1')}</p><p class="note">${t('why_note2')}</p><p class="note">${t('why_note3')}</p><p class="note">${t('thr_note')} ${t('sim_note')}</p>
 <div class="acts"><button class="btn p" data-close>${t('close')}</button></div>`);
}
function consentModal(){openModal(`<span class="badge b-cum">${t('cm_sim')}</span><h2 style="margin-top:10px">${t('cm_t')}</h2><p style="margin-top:8px">${t('cm_body')}</p><div class="acts"><button class="btn" data-cm="no">${t('cm_no')}</button><button class="btn p" data-cm="yes">${t('cm_yes')}</button></div>`)}
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('mbg').classList.add('open')}
function closeModal(){document.getElementById('mbg').classList.remove('open')}

/* ================= events ================= */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-open],[data-filter],[data-adv],[data-reset],[data-add],[data-why],[data-consent],[data-withdraw],[data-cm],[data-close],[data-save],[data-post],[data-tour],[data-lang],[data-theme],#langBtn');
 if(!b){if(e.target.id==='mbg')closeModal();return}
 const c=route.v==='case'?byId(route.id):null;
 if(b.id==='langBtn'){lang=lang==='ar'?'en':'ar';render();return}
 if(b.dataset.lang){lang=b.dataset.lang;render();return}
 if(b.dataset.theme){document.documentElement.dataset.theme=b.dataset.theme;render();return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.open){const from=route.v==='cases'?'cases':'home';route={v:'case',id:b.dataset.open,from};msg=null;render();window.scrollTo({top:0});return}
 if(b.dataset.filter){filter=b.dataset.filter;render();return}
 if(b.dataset.tour){tourStep=Math.max(0,Math.min(5,tourStep+Number(b.dataset.tour)));applyTour();return}
 if(b.hasAttribute('data-close')){closeModal();return}
 if(!c)return;
 if(b.hasAttribute('data-adv')){advance(c);msg=null;render();return}
 if(b.hasAttribute('data-reset')){const i=cases.findIndex(x=>x.id==='A-03');cases[i]=scenarioA03();msg=null;render();return}
 if(b.dataset.add){addEvent(c,b.dataset.add);msg=null;render();return}
 if(b.hasAttribute('data-why')){whyModal(c);return}
 if(b.hasAttribute('data-consent')){consentModal();return}
 if(b.dataset.cm){const at=c.clock||(lang==='ar'?'قبل الزيارة':'pre-visit');
  if(b.dataset.cm==='yes'){c.consent={s:'granted',at,last:at};if(c.interactive){const z=[];if(c.step>=1)z.push('ent','reg','cw');if(c.step>=3)z.push('cl');c.loc=z}}
  else c.consent={s:'denied',at};
  addLog(c,'lg_consent',{ar:D.ar['c_'+c.consent.s],en:D.en['c_'+c.consent.s]});closeModal();render();return}
 if(b.hasAttribute('data-withdraw')){c.signals.forEach(s=>{if(s.src==='loc')s.preWithdraw=true});c.consent=Object.assign({},c.consent,{s:'withdrawn',last:c.clock||c.consent.last});addLog(c,'lg_consent',{ar:D.ar.c_withdrawn,en:D.en.c_withdrawn});render();return}
 if(b.hasAttribute('data-save')){saveForm(c);if(!msg.ok){const m=document.getElementById('fmsg');m.className='err';m.textContent=msg.text;msg=null;return}render();const f=document.getElementById('tour-5');f&&f.scrollIntoView({block:'center'});return}
 if(b.hasAttribute('data-post')){c.post=!c.post;render();return}
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;if(route.v!=='home'&&route.v!=='cases')route={v:'cases'};const pos=e.target.selectionStart;render();const el=document.getElementById('q');el.focus();el.setSelectionRange(pos,pos)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
